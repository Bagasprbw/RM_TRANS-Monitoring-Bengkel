name: Build and Deploy to Local Server

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Trigger Deploy ke Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract repository name to lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/backend:buildcache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/frontend:buildcache,mode=max

      - name: Kirim sinyal deploy ke server
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '{}' | openssl dgst -sha256 -hmac '${{ secrets.DEPLOY_WEBHOOK_SECRET }}' | awk '{print $2}')" \
            -d '{}' \
            https://monitoring.${{ secrets.DEPLOY_DOMAIN }}/hooks/deploy \
            --fail-with-body

      - name: Deploy berhasil!
        run: echo "✅ Sinyal deploy berhasil dikirim ke server!"
