services:

  # ─────────────────────────────────────────
  # DATABASE: MySQL 8
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: rm_trans_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-rm_trans}
      MYSQL_USER: ${DB_USERNAME:-rm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rm_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # BACKEND: Laravel (PHP-FPM)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rm_trans_backend
    restart: unless-stopped
    environment:
      APP_NAME: "RM Trans Monitoring Bengkel"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rm_trans}
      DB_USERNAME: ${DB_USERNAME:-rm_user}
      DB_PASSWORD: ${DB_PASSWORD:-rm_password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────
  # NGINX BACKEND: Proxy PHP-FPM Laravel
  # ─────────────────────────────────────────
  nginx-backend:
    image: nginx:1.25-alpine
    container_name: rm_trans_nginx_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      - backend
    networks:
      - app_network

  # ─────────────────────────────────────────
  # FRONTEND: Vue 2 (Vite Build) + Nginx
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: rm_trans_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - nginx-backend
    networks:
      - app_network

# ─────────────────────────────────────────
# VOLUMES & NETWORKS
# ─────────────────────────────────────────
volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local

networks:
  app_network:
    driver: bridge
