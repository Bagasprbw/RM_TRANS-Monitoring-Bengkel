services:

  # ─────────────────────────────────────────
  # DATABASE: MySQL 8
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: rm_trans_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-rm_trans}
      MYSQL_USER: ${DB_USERNAME:-rm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rm_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # BACKEND: Laravel (PHP-FPM)
  # ─────────────────────────────────────────
  backend:
    build: ./backend
    image: ghcr.io/ronaltama/rm_trans-monitoring-bengkel/backend:latest
    container_name: rm_trans_backend
    restart: unless-stopped
    environment:
      APP_NAME: "RM Trans Monitoring Bengkel"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rm_trans}
      DB_USERNAME: ${DB_USERNAME:-rm_user}
      DB_PASSWORD: ${DB_PASSWORD:-rm_password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────
  # NGINX BACKEND: Proxy PHP-FPM Laravel
  # ─────────────────────────────────────────
  nginx-backend:
    image: nginx:1.25-alpine
    container_name: rm_trans_nginx_backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      - backend
    networks:
      - app_network

  # ─────────────────────────────────────────
  # FRONTEND: Vue 2 (Vite Build) + Nginx
  # ─────────────────────────────────────────
  frontend:
    image: ghcr.io/ronaltama/rm_trans-monitoring-bengkel/frontend:latest
    container_name: rm_trans_frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - nginx-backend
    networks:
      - app_network

  # ─────────────────────────────────────────
  # WEBHOOK: Auto-Deploy CI/CD
  # ─────────────────────────────────────────
  webhook:
    image: almir/webhook
    container_name: rm_trans_webhook
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-change_me}
    volumes:
      - ./webhook/hooks.json:/etc/webhook/hooks.json:ro
      - ./deploy.sh:/deploy/deploy.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - $HOME/projects:/home/projects
      - $HOME/.ssh:/root/.ssh:ro
    command: [ "-verbose", "-hooks=/etc/webhook/hooks.json", "-hotreload" ]
    networks:
      - app_network

  # ─────────────────────────────────────────
  # CLOUDFLARE TUNNEL: Expose ke Internet
  # (Aktifkan setelah setup tunnel di Cloudflare)
  # ─────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rm_trans_cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - frontend
      - nginx-backend
    networks:
      - app_network
    profiles:
      - tunnel # Hanya aktif jika dijalankan dengan: docker compose --profile tunnel up -d

# ─────────────────────────────────────────
# VOLUMES & NETWORKS
# ─────────────────────────────────────────
volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local

networks:
  app_network:
    driver: bridge
